<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Instrument Rental</title>
    <link rel="icon" type="image/x-icon" href="picture_here.jpeg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
      @layer utilities {
        .content-auto {
          content-visibility: auto;
        }

  <body class="bg-white min-h screen flex flex-col">
    <header class="bg-orange-50 shadow py-4">

              >
            </li>
          </ul>
        </div>
      </nav>

    <main id="main" class="flex-grow">
      <section class="h-[70vh] flex items-center justify-center overflow-hidden pt-5">
        <div class="flex items-center space-x-8 w-full">
          <img src="images/Cello_fixed.jpg" class="h-[70vh] w-4/5 object-contain" alt="Cello"/>

          <div class="w-1/2 text-left">

          </div>

        </div>
      </section>

    <footer class="bg-orange-800 text-white py-6 fixed bottom-0 inset-x-0">
      <div class="container mx-auto text-center">
        <p>2025 Rent Instruments. All rights reserved.</p>
      </div>
