<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Instrument Rental</title>
    <link rel="icon" type="image/x-icon" href="picture_here.jpeg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
      @layer utilities {
        .content-auto {
          content-visibility: auto;
        }
      }
    </style>
  </head>

  <body class="bg-white min-h-screen flex flex-col">

    <header class="bg-orange-50 shadow">
      <div class="container mx-auto flex justify-between items-center px-6 py-4">
        <h1 class="text-4xl font-bold font-serif text-orange-950">Rent Instruments</h1>
      </div>
      <nav>
        <div class="container mx-auto flex justify-end items-center px-6 mb-4">
          <ul class="flex space-x-6">
            <li><a href="#main" class="text-orange-950 font-semibold text-xl hover:text-orange-600">Home</a></li>
            <li><a href="#instruments" class="text-orange-950 font-semibold text-xl hover:text-orange-600">Instruments</a></li>
            <li><a href="#rent" class="text-orange-950 font-semibold text-xl hover:text-orange-600">Rent</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <main id="main" class="flex-grow">
      <section class="h-[70vh] flex items-center justify-center overflow-hidden pt-5">
        
      </section>

    <section class="bg-orange-50 py-16">
        
    </section>

    <section id="instruments" class="bg-orange-50 py-16">
      <h3 class="text-center text-3xl mb-10 font-semibold text-orange-900">Instruments</h3>
        <div class="container mx-auto px-6 m-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 text-center">
              <div>
                <img src="images/violin2.jpg" class="w-64 h-64 mx-auto object-contain rounded-lg shadow bg-white" alt="Violin">
                <p class="mt-3 text-lg">Violin</p>
              </div>

              <div>
                <img src="images/Guitar2.jpeg" class="w-64 h-64 mx-auto object-contain rounded-lg shadow bg-white" alt="Guitar">
                <p class="mt-3 text-lg">Guitar</p>
              </div>
            
              <div>
                <img src="images/cello2.jpg" class="w-64 h-64 mx-auto object-contain rounded-lg shadow bg-white" alt="Cello">
                <p class="mt-3 text-lg">Cello</p>
              </div>
            </div>
        </div>

        <div class="container mx-auto px-6 m-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 text-center">
              <div>
                <img src="images/keyboard.jpeg" class="w-64 h-64 mx-auto object-contain rounded-lg shadow bg-white" alt="Keyboard">
                <p class="mt-3 text-lg">Piano Keyboard</p>
              </div>

              <div>
                <img src="images/electric_guitar.jpeg" class="w-64 h-64 mx-auto object-contain rounded-lg shadow bg-white" alt="Electric Guitar">
                <p class="mt-3 text-lg">Electric Guitar</p>
              </div>
            
              <div>
                <img src="images/trumpet.jpg" class="w-64 h-64 mx-auto object-contain rounded-lg shadow bg-white" alt="Trumpet">
                <p class="mt-3 text-lg">Trumpet</p>
              </div>
            </div>
        </div>

        <div class="container mx-auto px-6 m-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-center">
              <div>
                <img src="images/clarinet.jpeg" class="w-64 h-64 mx-auto object-contain rounded-lg shadow bg-white" alt="Clarinet">
                <p class="mt-3 text-lg">Clarinet</p>
              </div>

              <div>
                <img src="images/tuba.jpg" class="w-64 h-64 mx-auto object-contain rounded-lg shadow bg-white" alt="Tuba">
                <p class="mt-3 text-lg">Tuba</p>
              </div>
            </div>
        </div>
    </section>

    <section id="rent" class="bg-orange-50 py-16">
      
    </section>

    <section class="bg-orange-50 py-16">
        <div class="container mx-auto px-6">
        </div>
    </section>

    <section class="bg-orange-50 py-16">
        
    </section>

    </main>


    <footer class="bg-orange-800 text-white py-6 mt-auto">
      <div class="container mx-auto text-center">
        <p>2025 Rent Instruments. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
